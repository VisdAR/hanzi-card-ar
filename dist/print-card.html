<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>吐鲁番绿洲，扫码即玩图卡</title>
    <style>
      :root { color: #101827; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
      body { margin: 0; background: #e7dfcf; }
      .card { width: min(760px, 100vw); margin: 24px auto; padding: 26px; box-sizing: border-box; background: #f6f0e3; box-shadow: 0 18px 60px #10182744; }
      h1 { margin: 0; letter-spacing: .1em; font-size: 30px; }
      .sub { color: #3d9077; font-weight: 700; letter-spacing: .14em; }
      .layout { display: grid; grid-template-columns: 1fr 158px; gap: 18px; align-items: end; margin-top: 18px; }
      .target { width: 100%; display: block; border: 6px solid #d7a84a; box-sizing: border-box; }
      .qr { position: relative; overflow: hidden; text-align: center; border: 2px solid #a66a22; border-radius: 12px; padding: 10px 9px 12px; background: linear-gradient(145deg, #f7e7b3, #c7842d 55%, #8e511d); box-shadow: inset 0 0 0 3px #f9edcf, 0 8px 15px #10182733; }
      .seal-title { margin: 0 0 7px; color: #3b2619; font-family: "STKaiti", "Kaiti SC", serif; font-weight: 800; letter-spacing: .15em; font-size: 15px; }
      .qr-frame { display: grid; place-items: center; padding: 5px; background: #f6f0e3; border-radius: 4px; }
      .qr img { width: 116px; height: 116px; display: block; }
      .qr strong { display: block; margin-top: 8px; color: #3b2619; font-size: 14px; }
      .qr small { display: block; margin-top: 5px; color: #4e3524; line-height: 1.35; font-size: 11px; }
      .note { margin: 16px 0 0; font-size: 14px; line-height: 1.6; }
      @media print { body { background: #fff; } .card { width: 100%; margin: 0; box-shadow: none; } }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="sub">汉字绿洲，六境组字冒险</div>
      <h1>吐鲁番绿洲图卡</h1>
      <div class="layout">
        <img class="target" src="./assets/turpan-card.jpg" alt="吐鲁番绿洲 AR 识别图卡" />
        <aside class="qr" aria-label="扫码启动游戏金印">
          <p class="seal-title">汉字绿洲印</p>
          <div class="qr-frame"><img src="./assets/scan-to-play.svg?v=6" alt="扫码立即开启汉字绿洲游戏" /></div>
          <strong>轻扫金印，即刻入境</strong>
          <small>扫码后允许相机，再对准左侧图卡。</small>
        </aside>
      </div>
      <p class="note">这枚金印就是手机通用启动码：把它放在图卡边缘，既能融入画面，又保留二维码必需的浅色留白。打印时请保持左侧图卡完整、平整、清晰。</p>
    </article>
  </body>
</html>
