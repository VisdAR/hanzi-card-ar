<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#123744" />
    <title>立体绿洲，汉字图卡</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
    <link rel="stylesheet" href="./world360.css?v=6" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <video id="cameraFeed" autoplay playsinline muted aria-hidden="true"></video>
    <div id="sceneLayer" aria-hidden="true"></div>
    <canvas id="voxelReveal" aria-hidden="true"></canvas>

    <header class="topbar">
      <div class="realm-heading"><span id="realmIndex" class="realm-index">一</span><strong id="realmName">初醒藤影</strong></div>
      <div class="topbar-actions"><div class="language-switch" role="group" aria-label="解说语言"><button id="languageFr" type="button" aria-pressed="true">FR</button><button id="languageEn" type="button" aria-pressed="false">EN</button></div><a id="backLink" href="./index.html" aria-label="主菜单">Menu principal</a></div>
      <span id="realmTranslation" class="realm-translation" lang="fr">Ombres de vigne à l’aube</span>
    </header>

    <div id="floorReticle" class="floor-reticle" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="statusLine" class="status-line" role="status"><span class="foreign-copy"></span><span class="zh-copy"></span></div>
    <div id="safetyBadge" class="safety-badge"><span class="foreign-copy"></span><span class="zh-copy"></span></div>
    <div id="modeBadge" class="mode-badge" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></div>

    <section id="entryGate" class="entry-gate" aria-label="场景进入步骤">
      <span class="gate-mark">✦</span>
      <h1 id="gateTitle"><span class="zh-copy"></span><span class="foreign-copy"></span></h1>
      <p id="gateIntro"><span class="foreign-copy"></span><span class="zh-copy"></span></p>
      <button id="startFloor" class="primary" type="button" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></button>
      <button id="startCompass" class="secondary" type="button"><span class="foreign-copy"></span><span class="zh-copy"></span></button>
      <p id="gateWarning" class="safety-note"><span class="foreign-copy"></span><span class="zh-copy"></span></p>
      <div id="capabilityNote" class="capability-note" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></div>
    </section>

    <div id="realmNarration" class="realm-narration" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></div>
    <div id="gameReticle" class="game-reticle" hidden aria-hidden="true"></div>
    <div id="handPointer" class="hand-pointer" hidden aria-hidden="true"></div>
    <section id="interactionPanel" class="interaction-panel" hidden aria-live="polite">
      <div id="gameHint" class="game-hint"><span class="foreign-copy"></span><span class="zh-copy"></span></div>
      <div class="game-actions"><button id="grabButton" type="button" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></button><button id="releaseButton" type="button" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></button><button id="nextWord" type="button" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></button></div>
    </section>
    <div id="gameExplainer" class="game-explainer" hidden><span class="foreign-copy"></span><span class="zh-copy"></span></div>
    <nav id="realmNav" class="realm-nav" aria-label="预览六境" hidden></nav>
    <script type="module" src="./world360.js?v=7"></script>
  </body>
</html>
